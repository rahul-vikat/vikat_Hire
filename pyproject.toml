[project]
name = "vikat-hire"
version = "0.1.0"
description = "Vikat_Hire evidence-driven candidate screening system"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "groq>=0.13.0,<1.0",
    "pypdf>=5.0,<6.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "pytesseract>=0.3.13,<1.0",
    "pypdfium2>=4.30,<5.0",
    "langgraph-checkpoint-postgres==3.0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
